<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zomato Restaurant Listing</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f8f8;
            font-family: sans-serif;
        }

        h1 {
            color: #e23744;
        }

        .restaurant-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
            height: 100%;
        }

        .restaurant-card h3 {
            color: #333;
        }

        .restaurant-card p {
            color: #666;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center mb-4">Zomato Restaurants</h1>

        <div class="row g-4">

            <!-- Restaurant 1 -->
            <div class="col-6">
                <div class="restaurant-card">
                    <h3>Pizza Palace</h3>
                    <p>Delicious pizzas, burgers, and tasty Italian food.</p>
                </div>
            </div>

            <!-- Restaurant 2 -->
            <div class="col-6">
                <div class="restaurant-card">
                    <h3>Spice Garden</h3>
                    <p>Enjoy spicy Indian dishes and traditional Gujarati thalis.</p>
                </div>
            </div>

            <!-- Restaurant 3 -->
            <div class="col-6">
                <div class="restaurant-card">
                    <h3>Royal Biryani</h3>
                    <p>Fresh and flavorful biryani with authentic spices.</p>
                </div>
            </div>

            <!-- Restaurant 4 -->
            <div class="col-6">
                <div class="restaurant-card">
                    <h3>Cafe Coffee</h3>
                    <p>Relax with coffee, sandwiches, and delicious desserts.</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
