<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 6px #ccc;
            height: 100%;
        }

        .product-card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        .btn-buy {
            background-color: #2874f0;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <h2 class="text-center mb-4">Flipkart Products</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://i.pinimg.com/736x/72/2f/61/722f61c87d6d85b6a2901faa489ecc23.jpg" alt="Mobile">
                    <h4 class="mt-3">Smartphone</h4>
                    <p>8GB RAM | 128GB Storage</p>
                    <p class="price">₹1,14,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://i.pinimg.com/736x/95/5a/3f/955a3f404af9bd98da779dc8c259fc79.jpg" alt="Laptop">
                    <h4 class="mt-3">Laptop</h4>
                    <p>16GB RAM | 512GB SSD</p>
                    <p class="price">₹49,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>


            <div class="col-md-4">
                <div class="product-card">
                    <img src="https://i.pinimg.com/736x/c2/6a/1d/c26a1d17d505a0884610d8b2c590f2a3.jpg"
                        alt="Samsung buds">
                    <h4 class="mt-3">Samsung buds</h4>
                    <p>Wireless Bluetooth</p>
                    <p class="price">₹1,499</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
