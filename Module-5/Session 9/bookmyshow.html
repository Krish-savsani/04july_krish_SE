<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookMyShow Movie Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .movie-card {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        .movie-poster {
            width: 100%;
            max-width: 250px;
            border-radius: 10px;
        }

        .movie-title {
            color: #333;
        }

        .rating {
            color: #e23744;
            font-weight: bold;
        }

        .book-btn {
            background-color: #e23744;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
        }

        .book-btn:hover {
            background-color: #c91e30;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <h2 class="text-center mb-4">Movie Details</h2>

        <div class="movie-card">
            <div class="row align-items-center g-4">

                <!-- First Column: Movie Poster -->
                <div class="col-md-4 text-center">
                    <img src="https://i.pinimg.com/736x/89/ff/4e/89ff4ef19a0ff80ed73dcbf797f84f38.jpg"
                        alt="Movie Poster" class="movie-poster">
                </div>

                <!-- Second Column: Movie Details -->
                <div class="col-md-8">

                    <h2 class="movie-title">Dhurandhar</h2>

                    <p><strong>Genre:</strong> Action, Thriller, Drama</p>

                    <p class="rating">8.5/10</p>

                    <p>
                        An action-packed movie filled with suspense,
                        drama, and exciting moments.
                    </p>

                    <button class="book-btn">Book Now</button>

                </div>

            </div>
        </div>

    </div>

</body>

</html>
