<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Product Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
            padding: 20px;
        }

        .product-card {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            background-color: white;
            padding: 20px;
            max-width: 600px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .product-card img {
            width: 200px;
            height: 180px;
            object-fit: contain;
        }

        .details {
            flex: 1;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            background-color: #2874f0;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        /* Mobile screen */
        @media (max-width: 600px) {
            .product-card {
                flex-direction: column;
                text-align: center;
            }

            .product-card img {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="product-card">

        <img src="https://i.pinimg.com/736x/72/2f/61/722f61c87d6d85b6a2901faa489ecc23.jpg"
             alt="Smartphone">

        <div class="details">
            <h2>Samsung S26 Ultra</h2>
            <p>8GB RAM | 128GB Storage</p>
            <p class="price">₹1,14,999</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
