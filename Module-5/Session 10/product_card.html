<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flipkart Product Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-card {
            width: 18rem;
            margin: 50px auto;
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px #ccc;
        }

        .product-img {
            height: 220px;
            object-fit: contain;
            padding: 15px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        .buy-btn {
            background-color: #2874f0;
            color: white;
        }

        .buy-btn:hover {
            background-color: #1558c0;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card product-card">

            <!-- Product Image -->
            <img src="https://i.pinimg.com/736x/72/2f/61/722f61c87d6d85b6a2901faa489ecc23.jpg"
                 class="card-img-top product-img"
                 alt="Smartphone">

            <!-- Product Details -->
            <div class="card-body">

                <h5 class="card-title">Samsung Smartphone</h5>

                <p class="card-text">
                    8GB RAM | 128GB Storage
                </p>

                <p class="price">₹1,14,999</p>

                <button class="btn buy-btn w-100">
                    Buy Now
                </button>

            </div>
        </div>

    </div>

</body>
</html>
