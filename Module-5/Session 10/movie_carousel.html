<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookMyShow Movie Carousel</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #e23744;
        }

        .movie-poster {
            height: 400px;
            width: 100%;
            object-fit: contain;
            background-color: #222;
        }

        .carousel-caption {
            position: static;
            background-color: white;
            color: #333;
            padding: 15px;
        }

        .carousel-caption h5 {
            color: #e23744;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container my-5">

        <h2 class="text-center mb-4">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">

            <!-- Carousel Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0" class="active"
                    aria-label="Movie 1"></button>

                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"
                    aria-label="Movie 2"></button>

                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"
                    aria-label="Movie 3"></button>
            </div>

            <!-- Movie Slides -->
            <div class="carousel-inner">

                <!-- Movie 1 -->
                <div class="carousel-item active">
                    <img src="https://i.pinimg.com/736x/6c/66/79/6c6679f62ce53d79356ea92ad174568e.jpg"
                        class="d-block movie-poster" alt="Dhurandhar movie poster">

                    <div class="carousel-caption">
                        <h5>Dhurandhar</h5>
                        <p>Action | Thriller | Hindi</p>
                    </div>
                </div>

                <!-- Movie 2 -->
                <div class="carousel-item">
                    <img src="https://i.pinimg.com/1200x/4a/59/f3/4a59f32b507455927345006d59a42e91.jpg"
                        class="d-block movie-poster" alt="Chhaava movie poster">

                    <div class="carousel-caption">
                        <h5>Chhaava</h5>
                        <p>Historical | Action | Hindi</p>
                    </div>
                </div>

                <!-- Movie 3 -->
                <div class="carousel-item">
                    <img src="https://i.pinimg.com/736x/7c/ad/45/7cad45919e7262e35ff639885f26f4c6.jpg"
                        class="d-block movie-poster" alt="Stree 2 movie poster">

                    <div class="carousel-caption">
                        <h5>Stree 2</h5>
                        <p>Comedy | Horror | Hindi</p>
                    </div>
                </div>

            </div>

            <!-- Previous Button -->
            <button class="carousel-control-prev" type="button" data-bs-target="#movieCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon" aria-hidden="true"></span>

                <span class="visually-hidden">Previous</span>
            </button>

            <!-- Next Button -->
            <button class="carousel-control-next" type="button" data-bs-target="#movieCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon" aria-hidden="true"></span>

                <span class="visually-hidden">Next</span>
            </button>

        </div>
    </div>




</body>

</html>
