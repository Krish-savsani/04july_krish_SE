
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Enquiry Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .form-card {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h2 class="text-center mb-4">Gym Enquiry</h2>

            <form action="#" method="get">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" id="name" name="name"
                           class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" name="email"
                           class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="plan" class="form-label">Select Plan</label>
                    <select id="plan" name="plan" class="form-select" required>
                        <option value="">Choose a plan</option>
                        <option>Monthly - ₹1,500</option>
                        <option>Quarterly - ₹4,000</option>
                        <option>Yearly - ₹14,000</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea id="message" name="message" rows="4"
                              class="form-control" placeholder="Write your message"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit Enquiry
                </button>
            </form>
        </div>
    </div>

</body>
</html>
