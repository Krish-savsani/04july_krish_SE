<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Spacing Utilities</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px #ccc;
        }

        .product-card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container my-4">

        <h2 class="text-center mb-4">Flipkart Products</h2>

        <div class="row">

            <!-- Card 1: Small spacing -->
            <div class="col-md-4">
                <div class="product-card m-1 p-2">
                    <img src="https://i.pinimg.com/736x/72/2f/61/722f61c87d6d85b6a2901faa489ecc23.jpg" alt="Smartphone">

                    <h5 class="mt-2">Smartphone</h5>
                    <p class="price">₹1,12,999</p>
                </div>
            </div>

            <!-- Card 2: Medium spacing -->
            <div class="col-md-4">
                <div class="product-card m-3 p-3">
                    <img src="https://i.pinimg.com/736x/66/f7/6c/66f76c3456977a59528a9ce4e62936a6.jpg" alt="Laptop">

                    <h5 class="mt-2">Laptop</h5>
                    <p class="price">₹45,999</p>
                </div>
            </div>

            <!-- Card 3: Large spacing -->
            <div class="col-md-4">
                <div class="product-card m-4 p-4">
                    <img src="https://i.pinimg.com/736x/4d/f6/3a/4df63a6aa48b91a48d4df8a4e50f5fba.jpg" alt="Headphones">

                    <h5 class="mt-2">Headphones</h5>
                    <p class="price">₹1,499</p>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
