<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bootstrap Theme Switcher</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container bg-light text-dark p-5 mt-5 rounded"
         id="mainContainer">

        <h1>Welcome to Movie World</h1>

        <p>Explore your favorite movies and book tickets online.</p>

        <button class="btn btn-primary" onclick="changeTheme()">
            Change Theme
        </button>

    </div>

    <script>
        function changeTheme() {
            let container = document.getElementById("mainContainer");

            container.classList.toggle("bg-light");
            container.classList.toggle("bg-dark");

            container.classList.toggle("text-dark");
            container.classList.toggle("text-light");
        }
    </script>

</body>
</html>
