<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Review Card</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .movie-card {
            max-width: 500px;
            margin: 50px auto;
            border-radius: 12px;
        }

        .rating {
            color: #e23744;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card movie-card shadow p-3">

            <div class="card-body">

                <!-- Movie Title -->
                <h2 class="card-title fs-3 fw-bold">
                    Dhurandhar
                </h2>

                <!-- Movie Genre -->
                <p class="text-muted small">
                    Action | Thriller | Hindi
                </p>

                <!-- Movie Rating -->
                <p class="rating fs-4 fw-bold">
                     4.5/5
                </p>

                <!-- Review Heading -->
                <h5 class="fw-semibold">
                    Movie Review
                </h5>

                <!-- Review Text -->
                <p class="lead fs-6">
                    An exciting movie with powerful action,
                    engaging scenes, and impressive performances.
                    A great choice for action movie lovers!
                </p>

                <!-- Reviewer Name -->
                <p class="text-secondary small fw-semibold mb-0">
                    Reviewed by: Rahul
                </p>

            </div>

        </div>

    </div>

</body>
</html>
