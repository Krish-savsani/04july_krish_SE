<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .movie-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .movie-card {
            position: relative;
            width: 200px;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px #ccc;
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .movie-name {
            padding: 12px;
            font-weight: bold;
            text-align: center;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #e50914;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>BookMyShow - Movies</h1>

    <div class="movie-grid">

        <div class="movie-card">
            <span class="badge">NEW</span>
            <img src="https://i.pinimg.com/736x/a5/d0/d6/a5d0d6c49595531d8ea75ec37c733e87.jpg"
                 alt="New movie poster">
            <div class="movie-name">Ramayana</div>
        </div>

        <div class="movie-card">
            <img src="https://i.pinimg.com/736x/7f/91/80/7f91805bd51810bc813c37704e745a01.jpg"
                 alt="Movie poster 2">
            <div class="movie-name">Toxic</div>
        </div>

        <div class="movie-card">
            <img src="https://i.pinimg.com/1200x/25/cd/b4/25cdb47e43abffd971ee418a193db8f7.jpg"
                 alt="Movie poster 3">
            <div class="movie-name">THE VVAAN</div>
        </div>

    </div>

</body>
</html>
