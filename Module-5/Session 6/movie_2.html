<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Grid</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .spacing {
            margin: 10px;
            padding: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .movie-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }

        .movie-card {
            position: relative;
            width: 200px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
        }

        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        .movie-name {
            text-align: center;
            font-weight: bold;
        }

        .badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: red;
            color: white;
            padding: 5px;
        }
    </style>
</head>

<body>

    <h2 class="spacing">BookMyShow - Movies</h2>

    <div class="movie-grid">

        <div class="movie-card spacing">
            <span class="badge">NEW</span>
            <img src="https://i.pinimg.com/736x/a5/d0/d6/a5d0d6c49595531d8ea75ec37c733e87.jpg"
                 alt="Movie 1">
            <div class="movie-name spacing">Ramayana</div>
        </div>

        <div class="movie-card spacing">
            <img src="https://i.pinimg.com/736x/7f/91/80/7f91805bd51810bc813c37704e745a01.jpg"
                 alt="Movie 2">
            <div class="movie-name spacing">Toxic</div>
        </div>

        <div class="movie-card spacing">
            <img src="https://i.pinimg.com/1200x/25/cd/b4/25cdb47e43abffd971ee418a193db8f7.jpg"
                 alt="Movie 3">
            <div class="movie-name spacing">THE VVAAN</div>
        </div>

    </div>

</body>
</html>
