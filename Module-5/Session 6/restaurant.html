<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Card</title>

    <style>
        body {
            font-family: sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .restaurant-card {
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #e23744;
            border-radius: 10px;
            background-color: white;
        }

        .restaurant-name {
            margin: 0 0 10px;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            color: #e23744;
        }

        .cuisine {
            margin: 10px 0;
            padding: 10px;
            border-bottom: 1px solid #ccc;
            color: #0bfbe3;
        }

        .rating {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #267e3e;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="restaurant-card">
        <h2 class="restaurant-name">The Grand Restaurant</h2>

        <p class="cuisine">
            South Indian, Punjabi
        </p>

        <div class="rating">4.5</div>
    </div>

</body>

</html>
