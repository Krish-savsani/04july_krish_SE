
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Playlists</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .playlist-img {
            height: 180px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Featured Playlists</h2>

        <div class="row g-4">

            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <img src="https://i.pinimg.com/736x/c5/96/06/c59606d75ba33acaaa020ceeff24c9db.jpg"
                         class="card-img-top playlist-img" alt="Romantic Hits">
                    <div class="card-body">
                        <h5 class="card-title">Romantic Hits</h5>
                        <p>Beautiful romantic songs.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <img src="https://i.pinimg.com/736x/5f/90/a8/5f90a8222c4fa0496cdb52afecff8c9d.jpg"
                         class="card-img-top playlist-img" alt="Sad Songs">
                    <div class="card-body">
                        <h5 class="card-title">Sad Songs</h5>
                        <p>Emotional songs for quiet moments.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="card h-100">
                    <img src="https://i.pinimg.com/736x/7c/9f/74/7c9f74e8c837d650a06066f4b487c927.jpg"
                         class="card-img-top playlist-img" alt="Travel Music">
                    <div class="card-body">
                        <h5 class="card-title">Travel Music</h5>
                        <p>Music for your journeys.</p>
                        <a href="https://open.spotify.com/" class="btn btn-success">Listen Now</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
