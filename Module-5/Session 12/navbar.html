
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky Navbar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html {
            scroll-behavior: smooth;
            scroll-padding-top: 75px;
        }

        .navbar {
            background-color: #171717;
        }

        .navbar-brand {
            color: #1db954;
            font-weight: bold;
        }

        .nav-link {
            color: white;
        }

        section {
            min-height: 350px;
            padding: 100px 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">

            <a class="navbar-brand" href="#home">MusicWorld</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#menu"
                    aria-controls="menu" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <section id="home" class="bg-light">
        <h1>Welcome to MusicWorld</h1>
        <p>Discover your favorite music.</p>
    </section>

    <section id="about" class="bg-success text-white">
        <h1>About Us</h1>
        <p>We love music and great artists.</p>
    </section>

    <section id="contact" class="bg-dark text-white">
        <h1>Contact</h1>
        <p>Connect with us online.</p>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
