
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Artist</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: white;
        }

        .artist {
            padding: 50px 20px;
            text-align: center;
            background-color: #202020;
        }

        .artist img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="artist">
        <img src="https://placehold.co/200x200/333333/ffffff?text=Artist"
             alt="Artist">

        <h1 class="mt-3">Arijit Singh</h1>
        <p class="text-secondary">Indian Playback Singer</p>

        <p>Known for soulful songs and beautiful melodies.</p>

        <a href="https://www.instagram.com/" class="btn btn-danger m-1">
            <i class="bi bi-instagram"></i> Instagram
        </a>

        <a href="https://www.youtube.com/" class="btn btn-primary m-1">
            <i class="bi bi-youtube"></i> YouTube
        </a>

        <a href="https://open.spotify.com/" class="btn btn-success m-1">
            <i class="bi bi-spotify"></i> Spotify
        </a>
    </div>

</body>
</html>
