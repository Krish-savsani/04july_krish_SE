<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-img {
            height: 160px;
            object-fit: contain;
            padding: 10px;
        }

        .price {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Featured Products</h2>

        <div class="row g-3">

            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1618366712010-f4ae9c647dcb?q=80&w=688&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top product-img" alt="Headphones">
                    <div class="card-body">
                        <h6>Headphones</h6>
                        <p class="price">₹1,499</p>
                        <button class="btn btn-primary btn-sm w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1589003077984-894e133dabab?q=80&w=1074&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top product-img" alt="Speaker">
                    <div class="card-body">
                        <h6>Bluetooth Speaker</h6>
                        <p class="price">₹2,499</p>
                        <button class="btn btn-primary btn-sm w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1786418288602-6d3b5530ed3e?q=80&w=686&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top product-img" alt="T-shirt">
                    <div class="card-body">
                        <h6>Music T-Shirt</h6>
                        <p class="price">₹699</p>
                        <button class="btn btn-primary btn-sm w-100">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1526394931762-90052e97b376?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                        class="card-img-top product-img" alt="Vinyl">
                    <div class="card-body">
                        <h6>Music Vinyl</h6>
                        <p class="price">₹999</p>
                        <button class="btn btn-primary btn-sm w-100">Buy Now</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>

</html>
