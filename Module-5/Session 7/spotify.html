<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial;
        }

        .playlist {
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            gap: 15px;
            padding: 20px;
        }

        .song {
            background-color: #282828;
            padding: 20px;
            width: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .song h3 {
            margin-bottom: 5px;
        }

        .song p {
            color: #b3b3b3;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <h1>My Spotify Playlist</h1>

    <div class="playlist">

        <div class="song">
            <h3>Apna Bana Le</h3>
            <p>Arijit Singh</p>
        </div>

        <div class="song">
            <h3>Heeriye</h3>
            <p>Jasleen Royal</p>
        </div>

        <div class="song">
            <h3>Kesariya</h3>
            <p>Arijit Singh</p>
        </div>

        <div class="song">
            <h3>Tere Vaaste</h3>
            <p>Sachin-Jigar</p>
        </div>

        <div class="song">
            <h3>Dhurandhar - Title Track</h3>
            <p>Shashwat Sachdev</p>
        </div>

    </div>

</body>
</html>
