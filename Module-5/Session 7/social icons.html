<!DOCTYPE html>
<html>
<head>
    <title>Social Icons Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 20px;
        }

        img {
            width: 100px;
            height: 100px;
        }
    </style>
</head>

<body>

    <h1>My Favorite Apps</h1>

    <div class="container">

        <img src="https://cdn.simpleicons.org/instagram/E4405F"
             alt="Instagram">

        <img src="https://cdn.simpleicons.org/whatsapp/25D366"
             alt="WhatsApp">

        <img src="https://cdn.simpleicons.org/zomato/CB202D"
             alt="Zomato">

        <img src="https://cdn.simpleicons.org/spotify/1DB954"
             alt="Spotify">

    </div>

</body>
</html>
